# 桌面版打包配置（electron-builder）
#
# 两个目标：
#   portable —— 绿色版，一个 exe，双击即用；数据放在 exe 旁边的 data/
#   nsis     —— 安装包，装到用户目录、建开始菜单和桌面快捷方式
#
# 关键决定：**关掉 asar**。
# 后端要 spawn PowerShell 脚本（scripts/win32/*.ps1）、要读 Python 源码
# （integrations/screen-vision/）、还要在 data/vision-venv 里找解释器。
# 这些路径在 asar 的虚拟文件系统里打不开 —— 打成 asar 之后第一次截图就会失败，
# 而失败信息会指向一个"文件不存在"的路径，很难查。多占几十 MB 换掉这类故障。
# 直接复用 node_modules 里已解压的 Electron，不让 electron-builder 再去下载/解
# 一次 158MB 的发行包。不用这条时，构建会卡在 "unpacking default Electron
# distribution" 十几分钟不动（它走的是另一个下载器，不复用 electron 包的缓存，
# 本机网络下基本必卡）。代价是必须先把 electron 装好（npm i 会做）。
electronDist: node_modules/electron/dist

appId: com.daigan.opsconsole
productName: 代肝运营台
copyright: Copyright © 2026 DAIGANG
asar: false
directories:
  output: dist-desktop
  buildResources: desktop/build
files:
  - desktop/**
  - src/**
  - shared/**
  - public/**
  # 运行时只需要 scripts/win32：后端起 PowerShell 做找窗口、切前台、按键、截屏、
  # OCR。checks/erpnext/migration/tools 是开发期脚本，跟着装进包里既多占空间，
  # 又等于把一整套运维命令发给最终用户。
  - scripts/win32/**
  - integrations/**
  - server.mjs
  - package.json
  - '!**/__pycache__/**'
  - '!**/*.pyc'
  # 编译脚本属于开发期，但 xfc-win32.cs 必须留着：win32.ps1 在 dll 读不出来时
  # 会回退到用 Add-Type 现场编译这份源码，排掉它等于拆掉那条兜底路径。
  - '!scripts/win32/build-win32-dll.ps1'
  # 图标生成脚本是开发期工具（要 Edge 无头截图），不是运行期依赖
  - '!desktop/assets/generate-icon.ps1'
  - '!integrations/**/*.md'
  - '!integrations/**/requirements-executor.txt'
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: desktop/assets/daigan.ico
  # 只跳过代码签名，**保留**图标和版本元数据（exe 的图标、产品名、版权全靠
  # 这一步写进去）。用 signAndEditExecutable: false 会连图标一起跳过，
  # 装出来的程序是 Electron 默认图标 —— 那就不算「有图标」了。
  # 副作用只是首次运行时 Windows 提示「未知发布者」，不影响功能。
  signExecutable: false
  artifactName: DaiganOps-${version}-${arch}.${ext}
portable:
  artifactName: DaiganOps-portable-${version}.${ext}
  # 绿色版不写注册表，数据在 exe 旁边的 data/（见 desktop/main.mjs 的 resolveDataDir）
  splashImage: null
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 代肝运营台
  artifactName: DaiganOps-setup-${version}.${ext}
  uninstallDisplayName: 代肝运营台
  deleteAppDataOnUninstall: false
